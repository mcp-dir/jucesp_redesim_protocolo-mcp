# Smithery configuration for JUCESP: REDESIM, Acompanhamento de Protocolo
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_jucesp_redesim_protocolo

name: jucesp_redesim_protocolo-mcp
displayName: "JUCESP: REDESIM, Acompanhamento de Protocolo"
description: >
  Acompanha o andamento de um protocolo REDESIM na JUCESP (abertura, alteração ou baixa de empresa). Hospedado pela plataforma, sem credenciais, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/jucesp_redesim_protocolo-mcp
repository: https://github.com/mcp-dir/jucesp_redesim_protocolo-mcp

tags:
  - jucesp_redesim_protocolo
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_jucesp_redesim_protocolo

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_jucesp_redesim_protocolo/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
